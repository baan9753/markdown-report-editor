function lock(value) {

const readData = file => new Promise((resolve,reject) => {

  reader.onerror = () => reject(Error('사진 파일을 읽을 수 없습니다.')); reader.readAsDataURL(file);

async function addPhotos(files) {

editor.onpaste = event => {

const box = editor.parentElement;
window.addEventListener('dragover',e => { if (e.dataTransfer.types.includes('Files')) e.preventDefault(); });
box.ondragover = e => { if (e.dataTransfer.types.includes('Files')) box.classList.add('dragging'); };

byId('picture').onclick = () => byId('photos').click();
byId('photos').onchange = e => { const files = [...e.target.files]; e.target.value = ''; addPhotos(files); };
function packed() {
  const text = editor.value;

    '<!-- report-colors main=' + mainColor + ' sub=' + subColor + ' -->\n';

}
function loadMarkdown(source) {

  applyColors(header ? header[1].toLowerCase() : defaultMain, header ? header[2].toLowerCase() : defaultSub);
  const body = header ? normalized.slice(header[0].length) : normalized;
  const text = body.replace(/^\[(photo-\d+)\]: <(data:image\/[^>\n]+)>\n?/gm, (line,key,data) => {

const markdownTypes = [{description:'마크다운 문서', accept:{'text/markdown':['.md','.markdown','.txt']}}];
function downloadMarkdown(name) {
  const url = URL.createObjectURL(new Blob([packed()],{type:'text/markdown;charset=utf-8'}));

byId('save').onclick = async () => {
  if (busy) return;

  try {

      catch (error) { await writer.abort().catch(() => {}); throw error; }

  } catch (error) {
    if (error.name !== 'AbortError') {

      window.alert('파일을 저장할 수 없습니다. 편집 내용은 그대로 있습니다. 다시 저장해 주세요.');
    }

};
async function openDocument(selectFile) {

byId('open').onclick = () => {

byId('mdfile').onchange = event => {

byId('pdf').onclick = async () => {
